version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: marine_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: marine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marine_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/marine_db
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marine_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
